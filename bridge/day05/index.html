  <script>
  (async () => {
    const hex = s => Uint8Array.from(s.match(/../g), h => parseInt(h, 16));
    const toHex = b => [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, "0")).join("");
    const SALT = hex("8f04559e7a4598fae1f4fabf24e9a5f8"), ITER = 300000, enc = new TextEncoder(), dec = new TextDecoder();
    const raw = Uint8Array.from(atob(document.getElementById("payload").textContent.trim()), c => c.charCodeAt(0));
    const nonce = raw.slice(0, 12), ct = raw.slice(12);
    const gate = document.getElementById("gate"), f = document.getElementById("f"), err = document.getElementById("err"), inp = document.getElementById("p");
    const store = { get: () => { try { return localStorage.getItem("bridge.key"); } catch (e) { return null; } },
                    set: v => { try { localStorage.setItem("bridge.key", v); } catch (e) {} },
                    del: () => { try { localStorage.removeItem("bridge.key"); } catch (e) {} } };
    async function derive(pw) {
      const km = await crypto.subtle.importKey("raw", enc.encode(pw), "PBKDF2", false, ["deriveBits"]);
      return crypto.subtle.deriveBits({ name: "PBKDF2", salt: SALT, iterations: ITER, hash: "SHA-256" }, km, 256);
    }
    async function open(bits) {
      const key = await crypto.subtle.importKey("raw", bits, "AES-GCM", false, ["decrypt"]);
      const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: nonce }, key, ct);
      const html = dec.decode(pt);
      // пока парсер оболочки активен, document.open() не очищает документ и write() дописывает в конец — ждём конца разбора
      if (document.readyState === "loading") await new Promise(r => document.addEventListener("DOMContentLoaded", r, { once: true }));
      document.open(); document.write(html); document.close();
    }
    if (location.hash === "#lock") { store.del(); history.replaceState(null, "", location.pathname + location.search); }
    const saved = store.get();
    if (saved) { try { await open(hex(saved)); return; } catch (e) { store.del(); } }
    gate.hidden = false; inp.focus();
    f.addEventListener("submit", async ev => {
      ev.preventDefault(); err.hidden = true; f.classList.add("busy");
      try { const bits = await derive(inp.value); await open(bits); store.set(toHex(bits)); }
      catch (e) { f.classList.remove("busy"); err.hidden = false; inp.select(); }
    });
  })();
  </script>
